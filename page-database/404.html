<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — page not found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #1a1e2b, #0b0d14);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 1.5rem;
            overflow: hidden;
        }

        .card {
            position: relative;
            background: rgba(18, 22, 33, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 3rem;
            padding: 4rem 2.5rem;
            max-width: 750px;
            width: 100%;
            box-shadow: 0 40px 70px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            text-align: center;
            overflow: hidden;
        }

        .biground-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 520px;
            height: 520px;
            border-radius: 50%;
            background-image: url('https://i.pinimg.com/originals/d4/89/d6/d489d62748dec3bef92eaf7361b07654.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.28;
            filter: blur(2px) brightness(0.9);
            z-index: 0;
            pointer-events: none;
            animation: softPulse 4s infinite alternate ease-in-out;
        }

        .biground-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, rgba(10, 14, 25, 0.2), rgba(5, 8, 18, 0.85));
        }

        @keyframes softPulse {
            0% {
                opacity: 0.22;
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                opacity: 0.34;
                transform: translate(-50%, -50%) scale(1.05);
            }
        }

        .content {
            position: relative;
            z-index: 1;
        }

        .error-code {
            font-size: 6.5rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 1;
            background: linear-gradient(to bottom, #ffffff, #a0b0d0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
            text-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.4));
        }

        .divider {
            width: 90px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #5f7fff, #a0b0ff, #5f7fff, transparent);
            margin: 1.5rem auto 1.5rem;
            border-radius: 4px;
            opacity: 0.8;
        }

        .message {
            color: #c2cbe3;
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 0.3px;
            max-width: 470px;
            margin: 0 auto 2.5rem;
            line-height: 1.65;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        .message strong {
            color: #ffffff;
            font-weight: 600;
            background: rgba(120, 150, 255, 0.15);
            padding: 0.15rem 0.5rem;
            border-radius: 6px;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            background: rgba(35, 45, 75, 0.85);
            border: 1px solid rgba(160, 190, 255, 0.25);
            color: #eef3ff;
            padding: 1rem 2.6rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 1.05rem;
            text-decoration: none;
            letter-spacing: 0.5px;
            backdrop-filter: blur(8px);
            transition: all 0.25s ease;
            box-shadow: 0 12px 25px -10px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 2;
        }

        .home-btn:hover {
            background: rgba(70, 95, 170, 0.95);
            border-color: rgba(190, 215, 255, 0.7);
            transform: translateY(-3px);
            box-shadow: 0 22px 35px -12px #1f2a50, 0 0 0 1px rgba(200, 220, 255, 0.35) inset;
            color: white;
            gap: 0.95rem;
        }

        .home-btn:active {
            transform: translateY(-1px);
            box-shadow: 0 8px 15px -5px black;
        }

        .home-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.2s ease;
        }

        .home-btn:hover svg {
            transform: translateX(-3px);
        }

        .tiny-note {
            margin-top: 2.5rem;
            font-size: 0.8rem;
            color: #6b748b;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            opacity: 0.65;
            position: relative;
            z-index: 2;
        }

        @media (max-width: 520px) {
            .card {
                padding: 3rem 1.5rem;
                border-radius: 2.5rem;
            }
            .biground-bg {
                width: 340px;
                height: 340px;
            }
            .error-code {
                font-size: 4.8rem;
            }
            .message {
                font-size: 1rem;
                margin-bottom: 2rem;
            }
            .home-btn {
                padding: 0.85rem 2rem;
                font-size: 0.95rem;
            }
        }

        @media (max-width: 380px) {
            .biground-bg {
                width: 280px;
                height: 280px;
            }
            .error-code {
                font-size: 3.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="biground-bg"></div>

        <div class="content">
            <div class="error-code">404</div>
            <div class="divider"></div>
            <p class="message">
                <strong>Oops!</strong> The page you're looking for drifted into the void.
                Let's get you back to solid ground.
            </p>

            <a href="/" class="home-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 12L12 3L21 12" />
                    <path d="M9 21V15H15V21" />
                    <path d="M5 12V19H19V12" />
                </svg>
                return home
            </a>

            <div class="tiny-note">✦ lost in the digital dark ✦</div>
        </div>
    </div>
</body>
</html>
